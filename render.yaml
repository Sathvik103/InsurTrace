# Render Blueprint for the ClearClaim API (FastAPI).
# Secrets marked sync:false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: clearclaim-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://insur-trace.vercel.app
      # auto: ledger disabled until GATEWAY_URL + GATEWAY_API_KEY point at a reachable gateway
      - key: FABRIC_MODE
        value: auto
      - key: ENABLE_DEMO_AUTH
        value: "true"
      - key: SUPABASE_URL
        sync: false
      # Supabase -> Project Settings -> API Keys -> Secret key (sb_secret_...)
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GATEWAY_URL
        sync: false
      - key: GATEWAY_API_KEY
        sync: false
