# Runs the whole stack on one machine. Values come from .env (see .env.example).
# The ledger gateway needs a running Fabric network; see docs/ledger.md.
services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - ALLOWED_ORIGINS=http://localhost:3000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - FABRIC_MODE=auto
      - GATEWAY_URL=http://blockchain_gateway:3001
      - GATEWAY_API_KEY=${GATEWAY_API_KEY}

  blockchain_gateway:
    build:
      context: ./backend/blockchain/gateway
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - GATEWAY_API_KEY=${GATEWAY_API_KEY}
      - FABRIC_RUNNER=native
      - FABRIC_CHANNEL=mychannel
      - FABRIC_CHAINCODE=vehicle
